name: Build and verify guest library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python packaging regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Foundation policy and hook regressions
        run: |
          mkdir -p build
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Isrc \
            src/DGPolicy.m src/DGHook.m tests/policy_tests.m \
            -framework Foundation -o build/policy_tests
          build/policy_tests
      - name: Build iOS arm64
        run: bash scripts/build.sh
      - name: Gemini request and mock transport regressions
        run: |
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Isrc \
            src/DGGemini.m tests/gemini_tests.m -framework Foundation -o build/gemini_tests
          build/gemini_tests
      - name: AI translation gating and cache regressions
        run: |
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Isrc \
            src/DGGemini.m src/DGTranslation.m tests/translation_tests.m -framework Foundation -o build/translation_tests
          build/translation_tests
      - name: Subtitle and GTX request/cache regressions
        run: |
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Isrc \
            src/DGGemini.m src/DGTranslation.m src/DGSource.m src/DGNarration.m src/DGTransduck.m src/DGMedia.m tests/media_tests.m -framework Foundation -framework AVFoundation -framework CoreMedia -o build/media_tests
          build/media_tests
      - name: Nam Minh audio timeline and cancellation regressions
        run: |
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Isrc \
            src/DGGemini.m src/DGTranslation.m src/DGSource.m src/DGMedia.m src/DGNarration.m src/DGTransduck.m tests/audio_tests.m \
            -framework Foundation -framework AVFoundation -framework CoreMedia -o build/audio_tests
          build/audio_tests
      - name: UIKit fixture on iPhone 15 Simulator
        run: python3 scripts/test_ui_simulator.py
      - name: Record source and toolchain
        run: |
          git rev-parse HEAD > build/SOURCE_COMMIT
          xcodebuild -version > build/TOOLCHAIN.txt
          xcrun --sdk iphoneos --show-sdk-version >> build/TOOLCHAIN.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DouyinGuest-arm64
          path: |
            build/DouyinGuest.dylib
            build/SHA256SUMS
            build/SOURCE_COMMIT
            build/TOOLCHAIN.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: UIKit-fixture-results
          path: |
            build/ui-fixture/ui-results.json
            build/ui-fixture/ui-fixture.png
            build/ui-fixture/ui-sidebar.png
            build/ui-fixture/ui-network-error.png
            build/ui-fixture/ui-search.png
            build/ui-fixture/ui-settings.png
            build/ui-fixture/ui-comments.png
            build/ui-fixture/ui-featured-narrow.png
            build/ui-fixture/ui-live.png
            build/ui-fixture/ui-public-finder.png
            build/ui-fixture/ui-public-profile.png
            build/ui-fixture/ui-feed-compat.png
            build/ui-fixture/ui-gemini.png
            build/ui-fixture/ui-gemini-context.png
            build/ui-fixture/ui-gemini-translation.png
            build/ui-fixture/ui-captions.png
            build/ui-fixture/ui-gtx-comments.png
          if-no-files-found: warn
          retention-days: 14
